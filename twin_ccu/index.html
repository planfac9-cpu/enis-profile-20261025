<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>에니스 CCU 설비 둘러보기</title><link rel="stylesheet" href="viewer.css?v=R07"><script type="importmap">{"imports":{"three":"./vendor/three180/three.module.min.js","three/addons/":"./vendor/three180/addons/"}}</script></head>
<body><main>
<header class="viewer-head"><div class="viewer-title"><strong>평택 CCU</strong><span id="mode-label">실사 이미지</span></div><div class="head-actions"><button id="tour-start" class="primary">▶ CCU 둘러보기</button><button id="panel-btn" aria-expanded="false" aria-controls="controls">보기 설정</button><button id="full" aria-label="전체화면">전체화면</button></div></header>
<div class="stage"><div id="canvas" hidden></div><img id="photo" src="data/low.jpg" alt="CCU 설비 실사 이미지"><div id="labels" aria-label="설비 이름"></div><div id="status" role="status" hidden></div>
<aside id="controls" hidden aria-label="보기 설정"><div class="panel-heading"><strong>보기 설정</strong><button id="panel-close" aria-label="보기 설정 닫기">✕</button></div><label class="field">설비 선택<select id="assembly"><option value="">전체 설비</option></select></label><div class="panel-actions"><button id="isolate" disabled>선택 설비만 보기</button><button id="reset">전체 복원</button></div><label class="check"><input type="checkbox" id="toggle-labels"> 설비 이름 표시</label><p class="panel-note">드래그: 회전 · 휠/두 손가락: 확대<br>우클릭/두 손가락: 이동</p></aside>
<div class="interaction-hint" id="interaction-hint">이미지 · 드래그하면 3D 탐색</div></div>
<nav class="toolbar" aria-label="설비 시점"><div class="views"><button data-view="low" aria-pressed="true">현장</button><button data-view="hero" aria-pressed="false">전경</button><button data-view="process" aria-pressed="false">공정설비</button><button data-view="storage" aria-pressed="false">저장설비</button><button data-view="towers" aria-pressed="false">수직설비</button></div><button id="explore">3D 탐색</button></nav>
<section id="tour" hidden aria-label="CCU 둘러보기"><div class="tour-copy"><span id="tour-step"></span><strong id="tour-title"></strong><p id="tour-text"></p></div><div class="tour-actions"><button id="tour-prev">이전</button><button id="tour-play">일시정지</button><button id="tour-next">다음</button><button id="tour-restart">처음부터</button><button id="tour-close">종료</button></div></section>
<footer class="caption"><span id="caption">현장 시점 · 낮은 사선</span><small>제공 모델 기반 시각화 · 재질과 주변 환경 재구성</small></footer>
</main><script type="module" src="app.js?v=R07"></script></body></html>
